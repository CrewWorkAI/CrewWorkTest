apiVersion: apps/v1
kind: Deployment
metadata:
  name: haiku-postgres-primary
  namespace: haiku-battle
  labels:
    app.kubernetes.io/component: postgres-primary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres-primary
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres-primary
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "haiku_user"
        - name: POSTGRES_PASSWORD
          value: "haiku_pass"
        - name: POSTGRES_DB
          value: "haiku"
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=scram-sha-256"
        volumeMounts:
        - name: pg-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pg-data
        emptyDir: {}
