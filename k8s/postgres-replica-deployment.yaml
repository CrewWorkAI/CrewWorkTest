apiVersion: apps/v1
kind: Deployment
metadata:
  name: haiku-postgres-replica
  namespace: haiku-battle
  labels:
    app.kubernetes.io/component: postgres-replica
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres-replica
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres-replica
    spec:
      containers:
      - name: postgres-replica
        image: postgres:15-alpine
        command: ["sh", "-c", "\
          echo 'Creating replication user' &&\
          psql -U $${PGUSER} -d $${PGDATABASE} -c \"CREATE REPLICATION SLOT IF NOT EXISTS haiku_slot LOGICAL wal2json;\" &&\
          echo 'Starting replication' &&\
          pg_basebackup -h haiku-postgres-primary -U $${PGUSER} -D /var/lib/postgresql/data -Fp -Xs -P &&\
          echo 'wal_level = replica' >> /var/lib/postgresql/data/postgresql.conf &&\
          echo 'max_wal_senders = 5' >> /var/lib/postgresql/data/postgresql.conf &&\
          echo 'hot_standby = on' >> /var/lib/postgresql/data/postgresql.conf &&\
          echo 'replication' >> /var/lib/postgresql/data/pg_hba.conf &&\
          echo 'host replication $${PGUSER} haiku-postgres-primary 0.0.0.0/0 scram-sha-256' >> /var/lib/postgresql/data/pg_hba.conf &&\
          postgres\"]
        env:
        - name: PGUSER
          value: "haiku_user"
        - name: PGPASSWORD
          value: "haiku_pass"
        - name: PGDATABASE
          value: "haiku"
        - name: PGHOST
          value: "haiku-postgres-primary"
        - name: PGPORT
          value: "5432"
        - name: PGSSLMODE
          value: "disable"
        volumeMounts:
        - name: pg-repl-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pg-repl-data
        emptyDir: {}
