apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: haiku-ingress
  namespace: haiku-battle
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: haiku.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: haiku-backend
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: haiku-frontend
            port:
              number: 80
