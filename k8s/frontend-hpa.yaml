apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: haiku-frontend-hpa
  namespace: haiku-battle
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: haiku-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
