apiVersion: apps/v1
kind: Deployment
metadata:
  name: haiku-frontend
  namespace: haiku-battle
  labels:
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
    spec:
      containers:
      - name: app
        image: "ghcr.io/cw-test/haiku-frontend:latest"
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: haiku-frontend-config
        - secretRef:
            name: haiku-frontend-secrets
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
